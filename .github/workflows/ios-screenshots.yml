name: iOS store screenshots

# Manual only. Runs the app on an iPhone Pro Max simulator, captures the store
# screenshots with integration_test and uploads them to App Store Connect.

on:
  workflow_dispatch:

env:
  ASC_KEY_ID: T7HY367GT9
  ASC_ISSUER_ID: 73c12ef5-d57e-4400-8a21-32e0a41b9f3d

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build the simulator app (no consent form or test-ad label)
        run: flutter build ios --simulator --debug --dart-define=STORE_SCREENSHOTS=true

      - name: Capture screenshots
        run: bash tool/ios_screenshots.sh

      - uses: actions/upload-artifact@v6
        with:
          name: store-screenshots
          path: screenshots
          retention-days: 7

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          body=$(printf '%s' "$ASC_KEY_P8" | sed -E 's/-----(BEGIN|END)[A-Z ]*-----//g' | tr -d '[:space:]')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key"
          echo "ASC_KEY_FILE=$key" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        run: |
          export FASTLANE_SKIP_UPDATE_CHECK=1
          cd fastlane
          fastlane ios ci_screenshots
