name: iOS release (TestFlight)

# Manual only. Builds a signed IPA on a free macOS runner (public repo) and
# uploads it to App Store Connect. Signing uses one permanent Apple
# Distribution certificate (IOS_DIST_CERT_ID) stored as a .p12 secret; the
# provisioning profile is resolved with the App Store Connect API key.
# Never revoke that certificate while a build signed with it is in review.
#
# Repository secrets:
#   ASC_KEY_P8             contents of AuthKey_<id>.p8 (App Manager key)
#   IOS_DIST_P12_BASE64    base64 of the distribution certificate + key (.p12)
#   IOS_DIST_P12_PASSWORD  password of that .p12
#   ADMOB_APP_ID_IOS, ADMOB_IOS_BANNER_UNIT_ID, ADMOB_IOS_INTERSTITIAL_UNIT_ID,
#   ADMOB_IOS_REWARDED_UNIT_ID, ADMOB_IOS_APP_OPEN_UNIT_ID   (required production values)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate commit (optional for legacy dispatch)
        type: string
        required: false
      upload:
        description: Validate and upload the signed IPA to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

env:
  ASC_KEY_ID: T7HY367GT9
  ASC_ISSUER_ID: 73c12ef5-d57e-4400-8a21-32e0a41b9f3d
  TEAM_ID: 53X3279WA3
  IOS_DIST_CERT_ID: Z563QGV77B

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the selected source commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "ASC_KEY_P8 secret is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # The secret may have been pasted with lost line breaks or without the
          # BEGIN/END lines: keep only the base64 body and rebuild a clean PEM.
          body=$(printf '%s' "$ASC_KEY_P8" | sed -E 's/-----(BEGIN|END)[A-Z ]*-----//g' | tr -d '[:space:]')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key"
          openssl pkey -in "$key" -noout || { echo "ASC_KEY_P8 is not a valid .p8 private key"; exit 1; }

      - name: AdMob app id
        env:
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
        run: |
          [[ "$ADMOB_APP_ID_IOS" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]
          [[ "$ADMOB_APP_ID_IOS" != *3940256099942544* ]]
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_APP_ID_IOS" ios/Runner/Info.plist

      - name: Build (no signing yet)
        env:
          B: ${{ secrets.ADMOB_IOS_BANNER_UNIT_ID }}
          I: ${{ secrets.ADMOB_IOS_INTERSTITIAL_UNIT_ID }}
          R: ${{ secrets.ADMOB_IOS_REWARDED_UNIT_ID }}
          O: ${{ secrets.ADMOB_IOS_APP_OPEN_UNIT_ID }}
          APP_ID: ${{ secrets.ADMOB_APP_ID_IOS }}
        run: |
          publisher="${APP_ID%~*}"
          for unit in "$B" "$I" "$R" "$O"; do
            [[ "$unit" =~ ^${publisher}/[0-9]{10}$ ]]
          done
          flutter pub get
          flutter build ios --release --no-codesign \
            "--dart-define=ADMOB_IOS_BANNER_UNIT_ID=$B" \
            "--dart-define=ADMOB_IOS_INTERSTITIAL_UNIT_ID=$I" \
            "--dart-define=ADMOB_IOS_REWARDED_UNIT_ID=$R" \
            "--dart-define=ADMOB_IOS_APP_OPEN_UNIT_ID=$O"

      - name: Archive (unsigned; signed at export)
        # Archiving with automatic signing asks for a *development* profile,
        # which needs a registered device. The account has none and does not
        # need one: the App Store distribution signature is applied at export.
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner             -configuration Release -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Sign and verify the App Store IPA
        env:
          ARCHIVE: ${{ runner.temp }}/Runner.xcarchive
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          export ASC_KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          export FASTLANE_SKIP_UPDATE_CHECK=1
          cd fastlane
          fastlane ios ci_release "upload:$UPLOAD"

      - name: Retain verified IPA for one day
        uses: actions/upload-artifact@v4
        with:
          name: doctorfilter-ios-candidate
          path: fastlane/build/export/*.ipa
          if-no-files-found: error
          retention-days: 1
