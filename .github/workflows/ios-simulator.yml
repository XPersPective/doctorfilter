name: iOS simulator build

# Manual only: macOS runners are free for public repositories, but there is no
# reason to burn them on every push. No secrets, no signing — this produces a
# simulator .app (test ad units) to upload to Appetize.io for screenshots.
# Signed App Store builds are a separate job (see codemagic.yaml).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --simulator --debug

      - name: Zip for Appetize
        run: cd build/ios/iphonesimulator && zip -r "$GITHUB_WORKSPACE/Runner-simulator.zip" Runner.app

      - uses: actions/upload-artifact@v6
        with:
          name: Runner-simulator
          path: Runner-simulator.zip
          retention-days: 7

      - name: Upload to Appetize
        # Optional: runs only when the APPETIZE_TOKEN secret exists. Appetize
        # returns a public key; open https://appetize.io/app/<publicKey>.
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        if: env.APPETIZE_TOKEN != ''
        run: |
          # The response carries a privateKey and this repo's logs are public:
          # print only the public URL.
          curl -sS --fail https://api.appetize.io/v1/apps             -u "$APPETIZE_TOKEN:"             -F file=@Runner-simulator.zip             -F platform=ios             | python3 -c "import sys,json; print(json.load(sys.stdin)['publicURL'])"
