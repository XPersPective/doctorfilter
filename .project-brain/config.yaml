schema_version: 4
skill_version: "4.0.6"
protocol_version: "1"

architecture:
  mode: "single"

git:
  history_mode: "preserve"
  commit: "auto"
  push: "every-task"
  push_policy: "every-task"

commands:
  test: "flutter test"
  lint: "flutter analyze"
  build: ""

tasks:
  id_prefix: "PB"

verification:
  default_risk: "medium"
